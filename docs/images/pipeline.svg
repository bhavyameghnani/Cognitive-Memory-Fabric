<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <title>CMF memory formation pipeline (LLM-first ingestion)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
      .llm{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.4}
      .code{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.4}
      .store{fill:#fffbeb;stroke:#d97706;stroke-width:1.4}
      .src{fill:#f1f5f9;stroke:#64748b;stroke-width:1.2}
      .t{font-size:13px;font-weight:700;fill:#0f172a}
      .s{font-size:11px;fill:#334155}
      .n{font-size:11px;font-weight:700;fill:#64748b}
      .h{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.04em}
      .l{stroke:#475569;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1000" height="430" rx="12"/>

  <!-- legend -->
  <rect x="640" y="16" width="14" height="14" rx="3" class="llm"/><text x="660" y="27" class="s">language model</text>
  <rect x="760" y="16" width="14" height="14" rx="3" class="code"/><text x="780" y="27" class="s">deterministic code</text>
  <rect x="890" y="16" width="14" height="14" rx="3" class="store"/><text x="910" y="27" class="s">database</text>
  <text x="24" y="28" class="h">MEMORY FORMATION, PER INTERACTION</text>

  <!-- sources -->
  <rect x="24" y="52" width="150" height="128" rx="10" class="src"/>
  <text x="38" y="76" class="t">Source interactions</text>
  <text x="38" y="98" class="s">meetings and calls</text>
  <text x="38" y="116" class="s">email threads</text>
  <text x="38" y="134" class="s">chat conversations</text>
  <text x="38" y="160" class="s">read-only; third parties</text>
  <text x="38" y="174" class="s">never count as evidence</text>

  <!-- row 1 -->
  <rect x="204" y="62" width="176" height="108" rx="10" class="llm"/>
  <text x="218" y="84" class="n">1</text><text x="232" y="84" class="t">Extraction</text>
  <text x="218" y="106" class="s">GPT-4o-mini reads the whole</text>
  <text x="218" y="122" class="s">conversation and proposes</text>
  <text x="218" y="138" class="s">memories with topic, value,</text>
  <text x="218" y="154" class="s">certainty and a quoted excerpt</text>

  <rect x="406" y="62" width="176" height="108" rx="10" class="code"/>
  <text x="420" y="84" class="n">2</text><text x="434" y="84" class="t">Fact checks</text>
  <text x="420" y="106" class="s">the quote exists in the turn;</text>
  <text x="420" y="122" class="s">speaker taken from the data;</text>
  <text x="420" y="138" class="s">the figure is in the quote;</text>
  <text x="420" y="154" class="s">re-anchoring of bare replies</text>

  <rect x="608" y="62" width="176" height="108" rx="10" class="llm"/>
  <text x="622" y="84" class="n">3</text><text x="636" y="84" class="t">Blind verifier</text>
  <text x="622" y="106" class="s">GPT-4.1-mini labels certainty</text>
  <text x="622" y="122" class="s">without seeing label 1; the</text>
  <text x="622" y="138" class="s">lower label wins; agreement</text>
  <text x="622" y="154" class="s">sets the confidence</text>

  <rect x="810" y="62" width="166" height="108" rx="10" class="code"/>
  <text x="824" y="84" class="n">4</text><text x="838" y="84" class="t">Evidence policy</text>
  <text x="824" y="106" class="s">advisor statements capped</text>
  <text x="824" y="122" class="s">at unconfirmed unless the</text>
  <text x="824" y="138" class="s">client confirms next turn;</text>
  <text x="824" y="154" class="s">non-final wording caps too</text>

  <path class="l" d="M174 116 H200" marker-end="url(#a)"/>
  <path class="l" d="M380 116 H402" marker-end="url(#a)"/>
  <path class="l" d="M582 116 H604" marker-end="url(#a)"/>
  <path class="l" d="M784 116 H806" marker-end="url(#a)"/>

  <!-- connector to row 2 -->
  <path class="l" d="M893 170 V200 H112 V228" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect x="24" y="232" width="176" height="108" rx="10" class="code"/>
  <text x="38" y="254" class="n">5</text><text x="52" y="254" class="t">Write validator</text>
  <text x="38" y="276" class="s">independent re-check of</text>
  <text x="38" y="292" class="s">the same rules from the</text>
  <text x="38" y="308" class="s">source data; may reject or</text>
  <text x="38" y="324" class="s">downgrade, never upgrade</text>

  <rect x="226" y="232" width="176" height="108" rx="10" class="code"/>
  <text x="240" y="254" class="n">6</text><text x="254" y="254" class="t">Integrity boundary</text>
  <text x="240" y="276" class="s">every durable write: identity,</text>
  <text x="240" y="292" class="s">client scope, provenance,</text>
  <text x="240" y="308" class="s">time from the cited turn,</text>
  <text x="240" y="324" class="s">attribution ceiling</text>

  <rect x="428" y="232" width="176" height="108" rx="10" class="store"/>
  <text x="442" y="254" class="t">Episodic memory</text>
  <text x="442" y="276" class="s">each statement, its speaker</text>
  <text x="442" y="292" class="s">and date; certainty, confidence;</text>
  <text x="442" y="308" class="s">verbatim excerpt and turn</text>
  <text x="442" y="324" class="s">as evidence; append-only</text>

  <rect x="630" y="232" width="150" height="108" rx="10" class="code"/>
  <text x="644" y="254" class="n">7</text><text x="658" y="254" class="t">Consolidation</text>
  <text x="644" y="276" class="s">code only; client-</text>
  <text x="644" y="292" class="s">attributable confirmed</text>
  <text x="644" y="308" class="s">values form a version</text>
  <text x="644" y="324" class="s">chain per slot</text>

  <rect x="806" y="232" width="170" height="108" rx="10" class="store"/>
  <text x="820" y="254" class="t">Semantic memory</text>
  <text x="820" y="276" class="s">current value per slot,</text>
  <text x="820" y="292" class="s">valid-from dates; earlier</text>
  <text x="820" y="308" class="s">values superseded, never</text>
  <text x="820" y="324" class="s">deleted</text>

  <path class="l" d="M200 286 H222" marker-end="url(#a)"/>
  <path class="l" d="M402 286 H424" marker-end="url(#a)"/>
  <path class="l" d="M604 286 H626" marker-end="url(#a)"/>
  <path class="l" d="M780 286 H802" marker-end="url(#a)"/>

  <text x="24" y="376" class="s">Steps 2, 4, 5 and 6 can only remove a memory or lower its certainty. No step can raise a label assigned earlier.</text>
  <text x="24" y="396" class="s">Retrieval and the report agent read the stored memories; a report states a current fact only from memory the boundary verified.</text>
</svg>
